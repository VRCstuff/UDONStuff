name: Build Release

on:
  workflow_dispatch:
  push:
    branches: main
    paths: Packages/com.vrcstuff.*/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Both packages share one version, so read it from common
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
          file_path: "Packages/com.vrcstuff.common/package.json"
          prop_path: "version"

      - name: Set Environment Variables
        run: echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Skip the rest of the job if this version has already been released (i.e. version wasn't bumped)
      - name: Check if version already released
        id: check_version
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/${{ env.version }}")" ]; then
            echo "Version ${{ env.version }} is already tagged, skipping release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Package Zips
        if: steps.check_version.outputs.exists == 'false'
        run: |
          for p in com.vrcstuff.common com.vrcstuff.controls; do
            (cd "Packages/$p" && zip -r "$GITHUB_WORKSPACE/$p-${{ env.version }}.zip" .)
          done

      - name: Create Tag
        if: steps.check_version.outputs.exists == 'false'
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"

      - name: Make Release
        if: steps.check_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            com.vrcstuff.common-${{ env.version }}.zip
            com.vrcstuff.controls-${{ env.version }}.zip
          tag_name: ${{ env.version }}
